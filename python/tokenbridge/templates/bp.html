<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blood Pressure Report</title>
  <!-- __SLEEP_DATA__ -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{
      --c-border:#e2e8f0;--c-bg:#f8fafc;--c-card:#fff;--c-muted:#64748b;
      --c-text:#0f172a;--c-accent:#3b82f6;
      --shadow-sm:0 1px 3px 0 rgb(0 0 0/.07),0 1px 2px -1px rgb(0 0 0/.07);
      --radius:10px;
    }
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;color:var(--c-text);background:#f1f5f9;margin:0;padding:0}
    h1,h2,h3{margin:0}
    h2{font-size:13px;font-weight:700}
    .rpt-header{background:#0f172a;border-bottom:1px solid #1e293b;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgb(0 0 0/.2)}
    .rpt-brand{display:flex;align-items:center;gap:10px}
    .rpt-brand-icon{background:#1e293b;color:#fca5a5;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .rpt-title{color:#f1f5f9;font-size:15px;font-weight:700;letter-spacing:-.02em}
    .rpt-sub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#475569;margin-top:1px}
    .rpt-meta{font-size:10px;color:#475569;text-align:right;line-height:1.6;font-family:'JetBrains Mono',ui-monospace,monospace}
    .page-wrap{max-width:1100px;margin:0 auto;padding:20px 24px}
    .kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .kpi{background:var(--c-card);border:1px solid var(--c-border);border-radius:8px;padding:10px 16px;box-shadow:var(--shadow-sm)}
    .kpi b{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--c-muted);margin-bottom:3px}
    .kpi span{font-size:16px;font-weight:700;color:var(--c-text)}
    .kpi.warn span{color:#dc2626}
    .kpi.caution span{color:#d97706}
    .btn{border:1px solid var(--c-border);background:var(--c-card);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:500;color:var(--c-text);font-family:'Inter',system-ui,sans-serif;display:inline-flex;align-items:center;gap:4px}
    .btn:hover{background:var(--c-bg)}
    .card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
    .card-head{background:#f8fafc;border-bottom:1px solid var(--c-border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
    .card-hint{font-size:10px;color:var(--c-muted);margin-top:3px;font-weight:500}
    .stats-table{width:100%;border-collapse:collapse}
    .stats-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--c-muted);background:#f8fafc;padding:9px 12px;border-bottom:1px solid var(--c-border);text-align:left;white-space:nowrap}
    .stats-table td{padding:8px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;vertical-align:middle;font-variant-numeric:tabular-nums}
    .stats-table tbody tr:last-child td{border-bottom:none}
    .legend-row{display:flex;gap:16px;padding:10px 18px;border-bottom:1px solid var(--c-border);flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-muted)}
    .legend-swatch{width:20px;height:3px;border-radius:2px}
    .legend-swatch.dashed{background:repeating-linear-gradient(90deg,currentColor 0,currentColor 4px,transparent 4px,transparent 8px)}
    footer{margin-top:2rem;text-align:center;color:var(--c-muted);padding-bottom:2rem;font-size:11px}
    @media print{.rpt-header{position:static}.card{box-shadow:none}}
  </style>
</head>
<body>
<header class="rpt-header">
  <div class="rpt-brand">
    <div class="rpt-brand-icon">&#x2764;&#xFE0F;</div>
    <div>
      <div class="rpt-title" id="report-title">Blood Pressure Report</div>
      <div class="rpt-sub">Withings Measurements</div>
    </div>
  </div>
  <div class="rpt-meta"><div id="report-timestamp"></div></div>
</header>

<div class="page-wrap">
  <div class="kpi-row" id="kpi-container"></div>

  <div class="card">
    <div class="card-head">
      <div>
        <h2>&#128200; Blood Pressure Over Time</h2>
        <div class="card-hint">Systolic / Diastolic with hypertension reference lines</div>
      </div>
      <a id="csv-link" href="#" download="bp_data.csv" class="btn">&#8659; Download CSV</a>
    </div>
    <div class="legend-row">
      <div class="legend-item"><div class="legend-swatch" style="background:#dc2626"></div>Systolic</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div>Diastolic</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#10b981"></div>Heart Rate</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f87171;opacity:.5"></div>Stage 1 threshold (130/80)</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#dc2626;opacity:.5"></div>Stage 2 threshold (140/90)</div>
    </div>
    <div style="padding:0 4px 4px">
      <div id="bp-plot"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>&#128202; Summary Statistics</h2></div>
    <div id="stats-container"></div>
  </div>

  <footer id="report-footer">Report generated</footer>
</div>

<script>
const _sd = window.SLEEP_DATA || {};
const _bundle = _sd.data?.['withings-bp'];

document.getElementById('report-title').textContent = 'BP Report: ' + (_sd.label || '');
document.getElementById('report-timestamp').textContent = _sd.reportTimestamp || '';
document.getElementById('report-footer').textContent = 'Report generated ' + (_sd.reportTimestamp || '');
if (_bundle?.csvDataUri) document.getElementById('csv-link').href = _bundle.csvDataUri;

document.addEventListener('DOMContentLoaded', () => {
  if (!_bundle?.records?.length) {
    document.getElementById('kpi-container').innerHTML = '<div class="kpi"><b>Error</b><span style="font-size:12px">No withings-bp data found</span></div>';
    return;
  }

  // Parse records — date is epoch seconds
  const records = _bundle.records.map(r => ({
    ...r,
    dateObj: new Date(Number(r.date) * 1000),
    systolic:   Number(r.systolic),
    diastolic:  Number(r.diastolic),
    heart_pulse: r.heart_pulse != null ? Number(r.heart_pulse) : null,
  })).filter(r => !isNaN(r.dateObj) && !isNaN(r.systolic) && !isNaN(r.diastolic))
    .sort((a, b) => a.dateObj - b.dateObj);

  renderKpis(records);
  renderPlot(records);
  renderStats(records);
});

function mean(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : NaN; }
function std(arr, avg) { return arr.length > 1 ? Math.sqrt(arr.map(x=>Math.pow(x-avg,2)).reduce((a,b)=>a+b)/(arr.length-1)) : 0; }

function renderKpis(records) {
  const sys  = records.map(r => r.systolic);
  const dia  = records.map(r => r.diastolic);
  const pul  = records.map(r => r.heart_pulse).filter(v => v != null && !isNaN(v));
  const pp   = records.map(r => r.systolic - r.diastolic);
  const mSys = mean(sys), mDia = mean(dia);

  // Hypertension classification (ACC/AHA 2017)
  const classify = (s, d) => {
    if (s >= 180 || d >= 120) return { label: 'Crisis', cls: 'warn' };
    if (s >= 140 || d >= 90)  return { label: 'Stage 2', cls: 'warn' };
    if (s >= 130 || d >= 80)  return { label: 'Stage 1', cls: 'caution' };
    if (s >= 120)              return { label: 'Elevated', cls: 'caution' };
    return { label: 'Normal', cls: '' };
  };
  const cls = classify(mSys, mDia);

  const minDate = records[0].dateObj.toISOString().split('T')[0];
  const maxDate = records[records.length-1].dateObj.toISOString().split('T')[0];

  const kpis = [
    { label: 'Date Range', value: minDate + ' – ' + maxDate, small: true },
    { label: 'Readings', value: String(records.length) },
    { label: 'Avg Systolic', value: mSys.toFixed(0) + ' mmHg', cls: cls.cls },
    { label: 'Avg Diastolic', value: mDia.toFixed(0) + ' mmHg' },
    { label: 'Classification', value: cls.label, cls: cls.cls },
    { label: 'Avg Pulse Pressure', value: mean(pp).toFixed(0) + ' mmHg' },
  ];
  if (pul.length) kpis.push({ label: 'Avg Heart Rate', value: mean(pul).toFixed(0) + ' bpm' });

  document.getElementById('kpi-container').innerHTML = kpis.map(k =>
    `<div class="kpi${k.cls?' '+k.cls:''}"><b>${k.label}</b><span style="${k.small?'font-size:12px':''}">${k.value}</span></div>`
  ).join('');
}

function renderPlot(records) {
  const dates = records.map(r => r.dateObj.toISOString().split('T')[0]);
  const sys   = records.map(r => r.systolic);
  const dia   = records.map(r => r.diastolic);
  const pul   = records.map(r => r.heart_pulse);
  const hasPulse = pul.some(v => v != null);

  const markerBase = { size: 6, line: { width: 1.5 } };
  const lineBase   = { width: 2, shape: 'linear' };
  const hover = (name, unit) =>
    `<b>${name}</b><br>%{x}<br><span style="font-weight:700">%{y:.0f} ${unit}</span><extra></extra>`;

  const traces = [
    {
      x: dates, y: sys, name: 'Systolic', mode: 'lines+markers',
      line: { ...lineBase, color: '#dc2626' },
      marker: { ...markerBase, color: '#fff', line: { color: '#dc2626', width: 1.5 } },
      hovertemplate: hover('Systolic', 'mmHg'),
    },
    {
      x: dates, y: dia, name: 'Diastolic', mode: 'lines+markers',
      line: { ...lineBase, color: '#3b82f6' },
      marker: { ...markerBase, color: '#fff', line: { color: '#3b82f6', width: 1.5 } },
      hovertemplate: hover('Diastolic', 'mmHg'),
    },
  ];

  if (hasPulse) {
    traces.push({
      x: dates, y: pul, name: 'Heart Rate', mode: 'lines+markers',
      yaxis: 'y2',
      line: { ...lineBase, color: '#10b981', dash: 'dot' },
      marker: { ...markerBase, color: '#fff', line: { color: '#10b981', width: 1.5 } },
      hovertemplate: hover('Heart Rate', 'bpm'),
    });
  }

  const refLine = (y, color, name) => ({
    x: [dates[0], dates[dates.length-1]], y: [y, y], name, mode: 'lines',
    line: { color, width: 1, dash: 'dash' }, showlegend: false, hoverinfo: 'skip',
  });
  traces.push(refLine(130, '#f87171', 'Stage 1 sys'));
  traces.push(refLine(140, '#dc2626', 'Stage 2 sys'));
  traces.push(refLine(80,  '#93c5fd', 'Stage 1 dia'));
  traces.push(refLine(90,  '#3b82f6', 'Stage 2 dia'));

  const layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { family: "'Inter',system-ui,sans-serif", size: 10, color: '#64748b' },
    hovermode: 'x unified',
    xaxis: { showgrid: false, zeroline: false, showline: true, linecolor: '#e2e8f0' },
    yaxis: {
      title: { text: 'Blood Pressure (mmHg)', font: { size: 10 } },
      showgrid: true, gridcolor: '#f1f5f9', zeroline: false,
      showline: true, linecolor: '#e2e8f0', rangemode: 'tozero',
    },
    autosize: true, margin: { l: 60, r: 16, t: 24, b: 60 }, height: 420,
    showlegend: false,
  };

  if (hasPulse) {
    layout.yaxis2 = {
      title: { text: 'Heart Rate (bpm)', font: { size: 10 } },
      overlaying: 'y', side: 'right',
      showgrid: false, zeroline: false, showline: true, linecolor: '#e2e8f0',
    };
  }

  Plotly.newPlot('bp-plot', traces, layout, { responsive: true, displaylogo: false });
}

function renderStats(records) {
  const fields = [
    { key: 'systolic',    label: 'Systolic (mmHg)' },
    { key: 'diastolic',   label: 'Diastolic (mmHg)' },
    { key: 'heart_pulse', label: 'Heart Rate (bpm)' },
    { key: '_pp',         label: 'Pulse Pressure (mmHg)' },
  ];

  const container = document.getElementById('stats-container');
  const table = document.createElement('table');
  table.className = 'stats-table';
  table.innerHTML = `<thead><tr>
    <th>Metric</th>
    <th style="text-align:center">Mean</th>
    <th style="text-align:center">SD</th>
    <th style="text-align:center">Min</th>
    <th style="text-align:center">Max</th>
    <th style="text-align:center">N</th>
  </tr></thead><tbody></tbody>`;
  container.appendChild(table);
  const tbody = table.querySelector('tbody');

  fields.forEach(({ key, label }) => {
    const vals = records.map(r =>
      key === '_pp' ? r.systolic - r.diastolic : r[key]
    ).filter(v => v != null && !isNaN(v));
    if (!vals.length) return;
    const avg = mean(vals), stdev = std(vals, avg);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${label}</td>
      <td style="text-align:center">${avg.toFixed(1)}</td>
      <td style="text-align:center">${stdev.toFixed(1)}</td>
      <td style="text-align:center">${Math.min(...vals).toFixed(0)}</td>
      <td style="text-align:center">${Math.max(...vals).toFixed(0)}</td>
      <td style="text-align:center;color:var(--c-muted)">${vals.length}</td>
    `;
    tbody.appendChild(tr);
  });
}

window.addEventListener('resize', () => {
  const p = document.getElementById('bp-plot');
  if (p?.querySelector('.js-plotly-plot')) Plotly.Plots.resize(p);
});
</script>
</body>
</html>
