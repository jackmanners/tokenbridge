[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tokenbridge"
version = "0.1.0"
description = "OAuth token management + health data client for research"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
tokenbridge = "tokenbridge.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
