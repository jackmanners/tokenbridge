site_name: TokenBridge
site_description: Self-hosted OAuth token management for health data research
site_url: https://jackmanners.github.io/tokenbridge
repo_url: https://github.com/jackmanners/tokenbridge
repo_name: jackmanners/tokenbridge
edit_uri: edit/main/docs/

theme:
  name: shadcn
  features:
    - content.code.select
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - navigation.indexes
  - admonition
  - fenced_code
  - codehilite
  - pymdownx.blocks.tab
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Deployment:
    - Overview: deployment.md
    - Setup Guide: basic-quickstart.md
    - Accessing Tokens: basic-access.md
  - Providers:
    - Google Health: providers/google-health.md
    - Withings: providers/withings.md
    - Oura: providers/oura.md
  - Client packages:
    - Python:
      - python/index.md
      - API Reference: python/reference.md
    - R:
      - r/index.md
      - API Reference: r/reference.md
