site_name: TokenBridge
site_description: Self-hosted OAuth token management for health data research
site_url: https://jackmanners.github.io/tokenbridge
repo_url: https://github.com/jackmanners/tokenbridge
repo_name: jackmanners/tokenbridge
edit_uri: edit/main/docs/

theme:
  name: shadcn
  features:
    - content.code.select
    - content.code.copy
    - content.tabs.link
    - navigation.indexes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - fenced_code
  - codehilite
  - pymdownx.blocks.tab
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Platform:
    - Overview: platform/overview.md
    - Deploying TokenBridge: platform/deploying.md
    - Providers:
      - Overview: platform/providers/index.md
      - Google Health: platform/providers/google-health.md
      - Withings: platform/providers/withings.md
      - Oura: platform/providers/oura.md
      - Polar: platform/providers/polar.md
      - Strava: platform/providers/strava.md
      - WHOOP: platform/providers/whoop.md
    - Reports: platform/reports.md
    - Direct HTTP API: platform/http-api.md
  - Client Libraries:
    - Overview: clients/index.md
    - Getting Started: clients/getting-started.md
    - Token API Reference: clients/token-reference.md
    - Data-Fetching Guide: clients/data-fetching.md
    - Examples: clients/examples.md
