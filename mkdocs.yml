site_name: TokenBridge
site_description: Self-hosted OAuth token management for health data research
site_url: https://jackmanners.github.io/tokenbridge
repo_url: https://github.com/jackmanners/tokenbridge
repo_name: jackmanners/tokenbridge
edit_uri: edit/main/docs/

theme:
  name: shadcn
  features:
    - content.code.select
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - fenced_code
  - codehilite
  - pymdownx.blocks.tab
  - pymdownx.blocks.details
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Deployment:
    - Overview: deployment.md
    - Setup Guide: basic-quickstart.md
    - Providers: providers.md
    - Without Packages: without-packages.md
  - Python:
    - python/index.md
    - API Reference: python/reference.md
  - R:
    - r/index.md
    - API Reference: r/reference.md
